<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{fullTitle}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{robots}}
<link rel="preload" href="/fonts/league-spartan-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/montserrat-variable.woff2" as="font" type="font/woff2" crossorigin>
{{preconnect}}
<link rel="stylesheet" href="{{css}}">
<script src="{{js}}" defer></script>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico?v=5" sizes="48x48">
<link rel="icon" href="/icon-192.png?v=5" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">
<link rel="manifest" href="/site.webmanifest">
<link rel="alternate" type="application/rss+xml" title="Thrill Wave Blog" href="/blog-feed.xml">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{fullTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
{{ogImageMeta}}
{{articleMeta}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@thrillwave_">
<!-- Analytics: turn on Cloudflare Web Analytics in the Pages dashboard (no code needed), or see README > Analytics for GA4. -->
{{jsonld}}
