<footer class="site-footer">
  <div class="container">
    <div class="site-footer__brand">
      <a class="site-footer__logo" href="/" aria-label="Thrill Wave home"><img src="{{site.logoSmall}}" alt="Thrill Wave" width="84" height="48"></a>
      <p>We're a video production company in Phoenix. We make films and photos, and we'll go wherever the story is.</p>
    </div>
    <div class="site-footer__cols">
      <div class="site-footer__col">
        <h2>Call / text</h2>
        <a href="tel:{{site.phoneHref}}">{{site.phone}}</a>
      </div>
      <div class="site-footer__col">
        <h2>Email</h2>
        <a href="mailto:{{site.email}}">{{site.email}}</a>
      </div>
      <div class="site-footer__col">
        <h2>Follow</h2>
        <ul class="social">{{social}}</ul>
      </div>
    </div>
    <div class="site-footer__bottom">
      <p>&copy; {{year}} Thrill Wave LLC. All rights reserved.</p>
      <ul class="site-footer__legal">
        <li><a href="/privacy">Privacy policy</a></li>
        <li><a href="/terms">Terms of service</a></li>
        <li>Phoenix, AZ</li>
      </ul>
    </div>
  </div>
</footer>
