<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container site-header__inner">
    <a class="logo" href="/" aria-label="Thrill Wave home">
      <img src="{{site.logoSmall}}" alt="Thrill Wave" width="84" height="48">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>{{nav}}</ul>
      <div class="site-nav__actions">
        <a class="btn btn--light btn--plain" href="/contact#start">Email us</a>
        <a class="btn btn--ghost-light btn--plain" href="tel:{{site.phoneHref}}">Call / text {{site.phone}}</a>
      </div>
    </nav>
    <div class="site-header__actions">
      <a class="btn btn--ghost-light btn--sm btn--plain" href="tel:{{site.phoneHref}}" data-reveal-phone="{{site.phone}}">Call / text</a>
      <a class="btn btn--light btn--sm btn--plain" href="/contact#start">Email us</a>
    </div>
  </div>
</header>
