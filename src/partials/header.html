<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container site-header__inner">
    <a class="logo" href="/" aria-label="Thrill Wave home">
      <img src="{{site.logoMark}}" alt="Thrill Wave" width="141" height="96">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main">
      <a class="site-nav__logo" href="/" aria-label="Thrill Wave home">
        <img src="{{site.logoMark}}" alt="" width="141" height="96">
      </a>
      <ul>{{nav}}</ul>
      <div class="site-nav__actions">
        <a class="btn btn--plain btn--pill btn--red" href="/contact#start">Email us</a>
        <a class="btn btn--plain btn--pill btn--clear" href="tel:{{site.phoneHref}}" aria-label="Call or text {{site.phone}}">Call / text</a>
      </div>
    </nav>
    <div class="site-header__actions">
      <a class="btn btn--sm btn--plain btn--pill btn--clear" href="tel:{{site.phoneHref}}" data-reveal-phone="{{site.phone}}">Call / text</a>
      <a class="btn btn--sm btn--plain btn--pill btn--red" href="/contact#start">Email us</a>
    </div>
  </div>
</header>
