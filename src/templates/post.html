<article class="post">
  <header class="post__header container">
    <nav class="post__crumbs" aria-label="Breadcrumb"><a href="/">Home</a> <span aria-hidden="true">/</span> <a href="/blog">Blog</a></nav>
    <h1>{{title}}</h1>
    <p class="post__meta"><span>{{author}}</span> <span aria-hidden="true">&middot;</span> <time datetime="{{date}}">{{dateLabel}}</time> <span aria-hidden="true">&middot;</span> <span>{{minutes}} min read</span></p>
  </header>
  <figure class="post__cover container">
    <img src="{{cover}}"{{coverSrcset}} alt="{{coverAlt}}" fetchpriority="high">
  </figure>
  <div class="post__body prose container">
{{content}}
  </div>
  <footer class="container post__footer">
    <div class="post__cats">{{categories}}</div>
  </footer>
</article>

<section class="section section--alt">
  <div class="container">
    <h2 class="section__title">Keep reading</h2>
    <div class="post-grid">
{{related}}
    </div>
  </div>
</section>

{{ender}}
